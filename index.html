  let bars = "";
  cats.forEach(c => {
    const v = ys.reduce((s,y)=>s+tot(y,c),0);
    const max = Math.max(...cats.map(cc=>ys.reduce((s,y)=>s+tot(y,cc),0))) || 1;
    bars += `<div>${c} £${Math.round(v).toLocaleString()}<div class="bar"><span style="width:${(v/max*100)}%;background:${colors[c]}"></span></div></div>`;
  });
  document.getElementById("bars").innerHTML = bars;

  let html = "<tr><th>Category</th>"+ys.map(y=>"<th>"+y+"</th>").join("")+"</tr>";
  cats.forEach(c => {
    html += "<tr><td>"+c+"</td>"+ys.map(y=>"<td>£"+Math.round(tot(y,c)).toLocaleString()+"</td>").join("")+"</tr>";
  });
  html += "<tr style='font-weight:600'><td>Total</td>"+ys.map(y=>"<td>£"+Math.round(ytot(y)).toLocaleString()+"</td>").join("")+"</tr>";
  document.getElementById("table").innerHTML = html;

  const ms = ["01","02","03","04","05","06","07","08","09","10","11","12"];
  const real = ys.filter(y=>y!=="2027");
  let mhtml = "<tr><th>Month</th>"+real.map(y=>"<th>"+y+"</th>").join("")+"</tr>";
  ms.forEach(m => {
    mhtml += "<tr><td>"+m+"</td>"+real.map(y=>{
      const rows = (DATA.monthly[y]||[]).filter(r=>r.Month===y+"-"+m);
      const v = cat==="all" ? rows.filter(r=>r.Category!=="Transfers").reduce((s,r)=>s+r["Debit Amount"],0)
                             : rows.filter(r=>r.Category===cat).reduce((s,r)=>s+r["Debit Amount"],0);
      return "<td>£"+Math.round(v).toLocaleString()+"</td>";
    }).join("")+"</tr>";
  });
  document.getElementById("months").innerHTML = mhtml;

  let merch = "";
  real.forEach(y => {
    const list = (DATA.top[y]||[]).slice(0,8).map(m=>`<tr><td>${m.name}</td><td>£${Math.round(m.amount).toLocaleString()}</td></tr>`).join("");
    merch += `<h3 style="margin:8px 0 4px;font-size:0.95rem">${y}</h3><table>${list}</table>`;
  });
  document.getElementById("merchants").innerHTML = merch || "Select a past year";
}

document.querySelectorAll("[data-y]").forEach(b => {
  b.onclick = () => {
    const y = b.dataset.y;
    if (years.has(y)) { if (years.size>1) years.delete(y); }
    else years.add(y);
    b.classList.toggle("active", years.has(y));
    draw();
  };
});
document.getElementById("cat").onchange = e => { cat = e.target.value; draw(); };
draw();
</script>
</body>
</html>
